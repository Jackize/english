<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - LexiGrow</title>

                        "surface-variant": "#d9e3f7",
                        "inverse-surface": "#273140",
                        "surface-dim": "#d0daef",
                        "background": "#f9f9ff",
                        "on-tertiary-fixed": "#131e19",
                        "on-background": "#121c2a",
                        "on-secondary": "#ffffff",
                        "on-secondary-container": "#007241",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#8bd79b",
                        "on-error-container": "#93000a",
                        "surface-container": "#e6eeff",
                        "primary-container": "#166534",
                        "secondary-container": "#8cf5b2",
                        "surface": "#f9f9ff",
                        "on-primary-fixed": "#00210b",
                        "primary-fixed": "#a6f4b5",

                        "outline": "#707a6f",

                        "tertiary": "#38443d",

                        "error": "#ba1a1a",
                        "surface-container-highest": "#d9e3f7",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "xs": "4px",

                        "gutter": "24px",

                        "lg": "48px",

                        "container-max": "1100px",
                        "sm": "12px"
                    },
                    "fontFamily": {

<style>
        .elevation-1 { box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04); }
        .elevation-2 { box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08); }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background">
<!-- TopNavBar Suppressed: Page intent is Linear/Transactional (Login) -->
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-4 md:p-gutter w-full max-w-container-max mx-auto">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl elevation-1 border border-outline-variant p-6 md:p-lg">
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">LexiGrow</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Welcome back. Please sign in to continue your learning journey.</p>
</div>
<form class="space-y-6">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="email">Email Address</label>
<input class="w-full px-4 py-3 rounded-lg border-[1.5px] border-outline-variant bg-surface-container-lowest text-on-background placeholder-outline-variant focus:border-secondary-container focus:ring-2 focus:ring-secondary-container/20 transition-all outline-none font-body-md text-body-md" id="email" name="email" placeholder="Enter your email" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-2" for="password">Password</label>
<input class="w-full px-4 py-3 rounded-lg border-[1.5px] border-outline-variant bg-surface-container-lowest text-on-background placeholder-outline-variant focus:border-secondary-container focus:ring-2 focus:ring-secondary-container/20 transition-all outline-none font-body-md text-body-md" id="password" name="password" placeholder="Enter your password" type="password"/>
<div class="mt-2 text-right">
<a class="font-label-sm text-label-sm text-primary hover:text-secondary-container transition-colors" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-[#86EFAC] text-[#166534] font-label-md text-label-md py-3 px-6 rounded-lg hover:bg-secondary-fixed transition-colors duration-200 elevation-1 active:elevation-2 flex items-center justify-center gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-8 text-center border-t border-outline-variant pt-6">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label-md text-label-md text-primary hover:text-secondary-container transition-colors" href="#">Create one</a>
</p>
</div>
</div>
</main>
<!-- Footer Suppressed on Transactional Screens to maintain focus -->
</body></html>
