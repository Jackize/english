<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review Mode - Meaning Revealed</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#8bd79b",
                        "on-secondary-container": "#007241",
                        "surface-dim": "#d0daef",
                        "surface-tint": "#1f6c3a",
                        "primary": "#004c22",
                        "on-primary-container": "#93e0a2",
                        "surface-container-high": "#dee9fd",
                        "outline-variant": "#bfc9bd",
                        "surface-container": "#e6eeff",
                        "on-primary-fixed": "#00210b",
                        "on-primary": "#ffffff",
                        "secondary": "#006d3e",
                        "surface-bright": "#f9f9ff",
                        "on-error-container": "#93000a",
                        "on-surface": "#121c2a",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#3e4943",
                        "on-secondary-fixed-variant": "#00522d",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#eff3ff",
                        "secondary-fixed-dim": "#73db9a",
                        "secondary-container": "#8cf5b2",
                        "on-background": "#121c2a",
                        "primary-container": "#166534",
                        "error-container": "#ffdad6",
                        "inverse-primary": "#8bd79b",
                        "on-secondary-fixed": "#00210f",
                        "primary-fixed": "#a6f4b5",
                        "on-surface-variant": "#404940",
                        "on-primary-fixed-variant": "#005226",
                        "surface-container-highest": "#d9e3f7",
                        "on-tertiary-container": "#c5d2ca",
                        "error": "#ba1a1a",
                        "inverse-surface": "#273140",
                        "tertiary": "#38443d",
                        "on-tertiary-fixed": "#131e19",
                        "tertiary-container": "#4f5b54",
                        "secondary-fixed": "#8ff8b4",
                        "tertiary-fixed-dim": "#bdcac1",
                        "surface": "#f9f9ff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#d9e3f7",
                        "background": "#f9f9ff",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#ebf1ff",
                        "tertiary-fixed": "#d9e6dd",
                        "outline": "#707a6f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "xs": "4px",
                        "lg": "48px",
                        "xl": "80px",
                        "base": "8px",
                        "container-max": "1100px",
                        "md": "24px",
                        "sm": "12px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #ffffff; /* Base level 0 pure white */
        }
        .card-elevation {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid #E5E7EB;
        }
        .card-elevation:hover {
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="min-h-screen text-on-surface font-body-md selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation Anchor - Suppressed as this is a focused learning session, but keeping a minimalist header for context -->
<header class="w-full flex justify-between items-center px-gutter py-md max-w-container-max mx-auto">
<button class="flex items-center gap-2 text-on-surface-variant hover:text-primary transition-colors group">
<span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Exit Session</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-label-md text-label-md text-on-surface-variant">Review Session</h1>
<div class="flex items-center gap-2 mt-1">
<span class="font-label-sm text-label-sm text-on-surface-variant">5 of 20</span>
<div class="w-32 h-2 bg-surface-container-high rounded-full overflow-hidden">
<div class="h-full bg-[#86EFAC] rounded-full" style="width: 25%;"></div>
</div>
</div>
</div>
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</header>
<!-- Main Canvas -->
<main class="max-w-container-max mx-auto px-gutter py-lg flex flex-col items-center justify-center min-h-[716px]">
<!-- Flashcard Container -->
<div class="w-full max-w-2xl bg-surface-container-lowest rounded-xl p-xl flex flex-col items-center text-center card-elevation transition-shadow duration-300">
<!-- Target Word -->
<h2 class="font-headline-lg text-headline-lg text-primary mb-md">Ephemeral</h2>
<!-- Pronunciation / Part of Speech (Optional context) -->
<div class="flex items-center gap-3 mb-lg text-on-surface-variant font-label-md text-label-md">
<span class="bg-surface-container px-3 py-1 rounded-full">Adjective</span>
<span>/əˈfem(ə)rəl/</span>
<button aria-label="Listen to pronunciation" class="hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="volume_up">volume_up</span>
</button>
</div>
<!-- Definition Area -->
<div class="w-full bg-[#F0FDF4] border border-[#86EFAC]/30 rounded-lg p-lg mb-md text-left">
<h3 class="font-label-sm text-label-sm text-[#166534] uppercase tracking-wider mb-2">Definition</h3>
<p class="font-body-lg text-body-lg text-on-surface">Lasting for a very short time; short-lived or transitory.</p>
</div>
<!-- Example Area -->
<div class="w-full text-left px-4 mb-xl">
<h3 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Example</h3>
<p class="font-body-md text-body-md text-on-surface-variant italic border-l-2 border-surface-variant pl-4">"Fashions are <strong class="text-primary font-semibold">ephemeral</strong>; what is popular today might be forgotten tomorrow."</p>
</div>
<!-- Interaction Buttons -->
<div class="w-full flex flex-col sm:flex-row gap-4 justify-center mt-auto">
<!-- Need a Refresher Button -->
<button class="flex-1 flex items-center justify-center gap-2 py-4 px-6 rounded-lg border-2 border-surface-variant bg-transparent text-[#374151] font-label-md text-label-md hover:bg-surface-container-low transition-colors group">
<span class="material-symbols-outlined text-outline" data-icon="history">history</span>
                    Need a Refresher
                </button>
<!-- Still Remembered Button -->
<button class="flex-1 flex items-center justify-center gap-2 py-4 px-6 rounded-lg bg-[#86EFAC] text-[#166534] font-label-md text-label-md hover:bg-[#73db9a] transition-colors shadow-sm active:scale-[0.98] transform">
<span class="material-symbols-outlined" data-icon="check_circle" data-weight="fill">check_circle</span>
                    Still Remembered
                </button>
</div>
</div>
<!-- Keyboard shortcuts hint (minimalist touch) -->
<p class="mt-lg font-label-sm text-label-sm text-outline-variant text-center opacity-70">
            Press <kbd class="px-2 py-1 bg-surface-container rounded-md mx-1 font-sans">1</kbd> for Refresher or <kbd class="px-2 py-1 bg-surface-container rounded-md mx-1 font-sans">2</kbd> for Remembered
        </p>
</main>
</body></html>
