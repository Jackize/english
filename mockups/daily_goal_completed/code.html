<style>
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #8bd79b;
            opacity: 0;
        }

        @keyframes fall {
            0% { opacity: 1; top: -10%; transform: translateX(0) rotate(0deg); }
            100% { opacity: 0; top: 110%; transform: translateX(20px) rotate(360deg); }
        }

        .celebration-bounce {
            animation: bounceIn 1s cubic-bezier(0.36, 0, 0.66, -0.56) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- Confetti Container -->
<div class="absolute inset-0 pointer-events-none z-0" id="confetti-container"></div>
<main class="flex-grow flex flex-col items-center justify-center p-gutter relative z-10 w-full max-w-container-max mx-auto">
<!-- Central Graphic/Card -->
<div class="bg-surface-container-lowest rounded-xl p-md md:p-lg flex flex-col items-center text-center w-full max-w-md mx-auto celebration-bounce" style="box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04); border: 1.5px solid #E5E7EB;">
<!-- Icon/Graphic -->
<div class="w-32 h-32 mb-8 rounded-full bg-surface-container-high flex items-center justify-center border-4 border-primary-fixed">
<span class="material-symbols-outlined text-primary-container" data-icon="eco" style="font-size: 64px; font-variation-settings: 'FILL' 1;">eco</span>
</div>
<!-- Typography -->
<h1 class="font-headline-lg text-headline-lg md:font-display md:text-display text-on-surface mb-sm tracking-tight">
                Daily Goal Reached!
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
                You've mastered <strong class="text-primary-container font-semibold">10</strong> new words today. Keep the <strong class="text-primary-container font-semibold">6-day streak</strong> alive!
            </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-4">
<button class="w-full bg-secondary-fixed text-primary-container font-label-md text-label-md py-4 rounded-lg hover:bg-secondary-fixed-dim transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="insights" style="font-size: 20px;">insights</span>
                    View Progress
                </button>
<button class="w-full bg-transparent border-2 border-outline-variant text-on-surface-variant font-label-md text-label-md py-4 rounded-lg hover:bg-surface-variant transition-colors duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="school" style="font-size: 20px;">school</span>
                    Continue Learning
                </button>
</div>
</div>
</main>
<script>
        // Simple confetti effect
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#8bd79b', '#a6f4b5', '#166534', '#dee9fd'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti-piece');
                
                // Randomize properties
                const left = Math.random() * 100;
                const animDuration = Math.random() * 3 + 2;
                const delay = Math.random() * 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                confetti.style.left = `${left}%`;
                confetti.style.backgroundColor = color;
                confetti.style.animation = `fall ${animDuration}s linear ${delay}s infinite`;
                
                container.appendChild(confetti);
            }
        });
    </script>
</body></html>
