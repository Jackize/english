<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>eng-growth - Learning Dashboard</title>

                        "on-tertiary-fixed": "#131e19",

                        "tertiary-container": "#4f5b54",
                        "inverse-surface": "#273140",

                        "tertiary": "#38443d",
                        "surface-container-high": "#dee9fd",
                        "primary-container": "#166534",
                        "on-tertiary-fixed-variant": "#3e4943",

                        "error": "#ba1a1a",
                        "background": "#f9f9ff",
                        "primary": "#004c22",

                        "on-primary-container": "#93e0a2",

                        "surface-container": "#e6eeff",

                        "surface-container-lowest": "#ffffff",
                        "secondary": "#006d3e",

                        "secondary-container": "#8cf5b2",

                        "secondary-fixed-dim": "#73db9a",
                        "secondary-fixed": "#8ff8b4",

                        "surface-container-highest": "#d9e3f7",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#00210f",
                        "outline": "#707a6f",
                        "on-tertiary": "#ffffff",
                        "inverse-primary": "#8bd79b",
                        "surface-variant": "#d9e3f7",
                        "on-error-container": "#93000a"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                    spacing: {
                        "base": "8px",

                        "xs": "4px",
                        "xl": "80px",
                        "sm": "12px",
                        "md": "24px",
                        "gutter": "24px",
                        "container-max": "1100px"
                    },
                    fontFamily: {
                        "headline-lg": ["Inter"],
                        "body-md": ["Inter"],

<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .card-shadow {
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.04);
        }
        .card-shadow-active {
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col md:hidden">
<!-- TopNavBar (Mobile Shell Adaptation) -->
<header class="bg-surface-container-lowest w-full top-0 z-50 sticky px-gutter py-4 flex justify-between items-center max-w-container-max mx-auto">
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">eng-growth</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-1 bg-tertiary-fixed text-on-tertiary-fixed px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined" data-icon="local_fire_department" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
<span class="font-label-md text-label-md">12</span>
</div>
<button class="text-on-surface-variant cursor-pointer active:opacity-80 transition-colors duration-200">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-[20px] pb-xl pt-sm relative overflow-hidden">
<!-- Progress Tracker -->
<div class="w-full mb-md px-2">
<div class="flex justify-between items-center mb-2">
<span class="font-label-sm text-label-sm text-on-surface-variant">Daily Goal</span>
<span class="font-label-sm text-label-sm text-primary">4 / 10 words</span>
</div>
<div class="h-[8px] w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-secondary-fixed w-[40%] rounded-full transition-all duration-500 ease-in-out"></div>
</div>
</div>
<!-- Horizontal Category Scroll (Moved from SideNav) -->
<div class="w-full overflow-x-auto no-scrollbar mb-lg -mx-[20px] px-[20px]">
<div class="flex gap-3 w-max pb-2">
<button class="flex items-center gap-2 bg-secondary-container text-on-secondary-container rounded-lg px-4 py-2 font-label-md text-label-md transition-transform scale-95 active:scale-90">
<span class="material-symbols-outlined text-[18px]" data-icon="dashboard">dashboard</span>
                    Learn
                </button>
<button class="flex items-center gap-2 bg-surface text-on-surface-variant border-1.5 border-outline-variant rounded-lg px-4 py-2 font-label-md text-label-md transition-transform scale-95 active:scale-90 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="list_alt">list_alt</span>
                    Review
                </button>
<button class="flex items-center gap-2 bg-surface text-on-surface-variant border-1.5 border-outline-variant rounded-lg px-4 py-2 font-label-md text-label-md transition-transform scale-95 active:scale-90 hover:bg-surface-container-high">
<span class="material-symbols-outlined text-[18px]" data-icon="psychology">psychology</span>
                    Mastered
                </button>
</div>
</div>
<!-- Flashcard Hero Area -->
<div class="flex-grow flex flex-col justify-center items-center w-full max-w-[400px] mx-auto">
<div class="relative w-full aspect-[4/5] perspective-1000">
<!-- Card Inner (Placeholder for flip animation structure, currently static front) -->
<div class="w-full h-full bg-surface-container-lowest rounded-[24px] card-shadow border border-[#E5E7EB] flex flex-col justify-center items-center p-md relative transition-transform duration-300 active:card-shadow-active">
<!-- Decorative background element for softness -->
<div class="absolute inset-0 bg-gradient-to-b from-surface-container-low/50 to-transparent rounded-[24px] pointer-events-none"></div>
<div class="text-center z-10">
<span class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase mb-sm block">Noun</span>
<h1 class="font-display text-display text-on-surface mb-md">Serendipity</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant italic opacity-0 transition-opacity duration-300" id="pronunciation">/ˌserənˈdipədē/</p>
</div>
<!-- Hint / Context Area (Initially hidden or subtle) -->
<div class="absolute bottom-md left-0 w-full text-center px-md">
<button class="text-secondary font-label-sm text-label-sm flex items-center justify-center gap-1 mx-auto bg-transparent border-1.5 border-outline-variant rounded-full px-3 py-1">
<span class="material-symbols-outlined text-[16px]" data-icon="lightbulb">lightbulb</span>
                            Show Context
                        </button>
</div>
</div>
</div>
</div>
<!-- Action Area -->
<div class="w-full mt-lg pb-md">
<button class="w-full bg-[#86EFAC] text-[#166534] font-headline-md text-headline-md py-4 rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2">
                Reveal Meaning
                <span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
<div class="flex justify-between items-center mt-sm px-2 hidden" id="feedback-actions">
<button class="w-[48%] bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md py-3 rounded-lg active:bg-error-container active:text-on-error-container transition-colors">Hard</button>
<button class="w-[48%] bg-surface text-on-surface-variant border border-outline-variant font-label-md text-label-md py-3 rounded-lg active:bg-secondary-container active:text-on-secondary-container transition-colors">Easy</button>
</div>
</div>
</main>
<!-- Bottom Navigation Shell (Mobile Semantic Map) -->
<nav class="bg-surface-container-lowest border-t border-outline-variant/30 fixed bottom-0 w-full z-50 pb-safe pb-4 pt-2 px-6 flex justify-between items-center shadow-[0_-4px_20px_rgba(0,0,0,0.02)] md:hidden">
<button class="flex flex-col items-center gap-1 text-primary w-16">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors w-16">
<span class="material-symbols-outlined" data-icon="menu_book">menu_book</span>
<span class="font-label-sm text-label-sm">Learn</span>
</button>
<button class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-colors w-16">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="font-label-sm text-label-sm">Admin</span>
</button>
</nav>
<script>
        // Simple micro-interaction for demonstration
        document.querySelector('button.bg-\\[\\#86EFAC\\]').addEventListener('click', function() {
            const btn = this;
            const pron = document.getElementById('pronunciation');
            const actions = document.getElementById('feedback-actions');
            
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span> Loading...';
            
            setTimeout(() => {
                pron.classList.remove('opacity-0');
                btn.classList.add('hidden');
                actions.classList.remove('hidden');
                actions.classList.add('flex');
            }, 600);
        });
    </script>
</body></html>
