# ============================================================
# CI/CD cho English Vocabulary App (Next.js 16 + Prisma 7)
# Runner: vps-docker-runner (Docker executor, image node:22)
# ============================================================

stages:
  - check
  - build
  - deploy

default:
  image: node:22
  interruptible: true

variables:
  # Cache npm giữa các job/pipeline → npm ci nhanh hơn nhiều
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json   # đổi lock file = cache key mới
  paths:
    - .npm/

# ------------------------------------------------------------
# Stage CHECK: lint + typecheck (chạy ở mọi push/MR)
# ------------------------------------------------------------
check:
  stage: check
  script:
    - npm ci --prefer-offline
    - npm run lint
    - npx tsc --noEmit
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------
# Stage BUILD: build production (chỉ ở nhánh chính)
# ------------------------------------------------------------
build:
  stage: build
  script:
    - npm ci --prefer-offline
    # prisma generate chạy qua postinstall, build script tự generate lại
    - npm run build
  artifacts:
    name: "build-$CI_COMMIT_REF_SLUG"
    paths:
      - .next/
    expire_in: 3 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------
# Stage DEPLOY: migrate database (chỉ bấm tay khi cần)
# ------------------------------------------------------------
prisma:migrate:
  stage: deploy
  script:
    - npm ci --prefer-offline
    - npx prisma migrate deploy
  when: manual          # chỉ chạy khi bấm nút trong UI
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ------------------------------------------------------------
# Stage DEPLOY: deploy app lên VPS qua SSH (bấm tay)
# ------------------------------------------------------------
deploy:production:
  stage: deploy
  image: node:22
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client rsync >/dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$VPS_DEPLOY_KEY" ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    # Đồng bộ source lên VPS (không gửi node_modules/.next/.env — image tự build trên đó)
    - >
      rsync -a --delete
      --exclude node_modules --exclude .next --exclude .git
      --exclude .env --exclude "*.db" --exclude .DS_Store --exclude mockups
      -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
      ./ "root@${VPS_HOST}:${VPS_DEPLOY_PATH}/repo/"
    # Cập nhật secret DATABASE_URL cho BuildKit (dùng khi docker build)
    - >
      echo -n "$DATABASE_URL" | ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no
      "root@${VPS_HOST}"
      "cat > ${VPS_DEPLOY_PATH}/secrets/database_url && chmod 600 ${VPS_DEPLOY_PATH}/secrets/database_url"
    # Build image mới + restart container
    - >
      ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "root@${VPS_HOST}"
      "cd ${VPS_DEPLOY_PATH} && docker compose build web && docker compose up -d && docker ps --filter name=english-vocab-app --format '{{.Status}}'"
    # Warm-up: pre-load route + curriculum cache để user đầu tiên
    # không chịu cold start (~3-4s sau mỗi lần restart container)
    - sleep 3
    - curl -s -o /dev/null --max-time 30 https://english.sanbong.cloud/ || true
    - curl -s -o /dev/null --max-time 30 https://english.sanbong.cloud/grammar || true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
